<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="apexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="apexSweep" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#apexBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Speed Grid Accent -->
  <path d="M8 48 Q 32 46 56 48" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 2" />
  <path d="M14 54 Q 32 52 50 54" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="0.75" />

  <!-- Main Apex 'A' Geometry -->
  <path d="M32 10 L48 50 L40 50 L35 37 L29 37 L24 50 L16 50 Z" 
        fill="url(#apexGlow)" 
        filter="url(#glow)" />

  <!-- Inner Triangular Cutout -->
  <path d="M32 21 L37.5 33 L26.5 33 Z" fill="#090d16" />

  <!-- Telemetry Sweep & Node Vector -->
  <path d="M12 40 Q 28 26 52 24" 
        stroke="url(#apexSweep)" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Glowing Telemetry Pulse Nodes -->
  <circle cx="28" cy="30" r="2.2" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="44" cy="25" r="1.8" fill="#38bdf8" />
  <circle cx="52" cy="24" r="2.5" fill="#a5f3fc" filter="url(#glow)" />
</svg>
